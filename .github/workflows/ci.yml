name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-sync:
    name: Shared code in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv run scripts/sync_shared.py --check

  agent-tests:
    name: Agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/agent
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python -m pytest -q tests

  functions-tests:
    name: Functions tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/functions
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv venv
      - run: uv pip install -r requirements.txt pytest
      # `python -m` puts src/functions on sys.path so the tests can import `collector`.
      - run: uv run --no-project python -m pytest -q tests
