# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: personal-agent
requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
infra:
    provider: microsoft.foundry
hooks:
    # Supporting resources (Foundry IQ, Blob, Cosmos DB, Functions) are deployed by our own Bicep.
    postprovision:
        windows:
            shell: pwsh
            run: ./scripts/postprovision.ps1
            interactive: false
            continueOnError: false
    predeploy:
        windows:
            shell: pwsh
            run: uv run --quiet ./scripts/sync_shared.py
            interactive: false
            continueOnError: false
    postdeploy:
        windows:
            shell: pwsh
            run: ./scripts/postdeploy.ps1
            interactive: false
            continueOnError: false
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - name: gpt-6.1-sol
              model:
                format: OpenAI
                name: gpt-6.1-sol
                version: "2026-09-29"
              sku:
                name: GlobalStandard
                capacity: 250
            - name: gpt-5.4-mini
              model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              sku:
                name: GlobalStandard
                capacity: 50
            - name: text-embedding-3-large
              model:
                format: OpenAI
                name: text-embedding-3-large
                version: "1"
              sku:
                name: GlobalStandard
                capacity: 100
    personal-agent:
        host: azure.ai.agent
        kind: hosted
        language: python
        name: personal-agent
        description: Personal information-gathering agent (Foundry IQ + web search + reports + source curation).
        project: src/agent
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        env:
            PYTHONNOUSERSITE: "1"
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            SEARCH_ENDPOINT: ${SEARCH_ENDPOINT}
            KNOWLEDGE_BASE_NAME: ${KNOWLEDGE_BASE_NAME}
            KNOWLEDGE_SOURCE_NAME: ${KNOWLEDGE_SOURCE_NAME}
            TOPIC_KNOWLEDGE_BASE_NAME: ${TOPIC_KNOWLEDGE_BASE_NAME}
            TOPIC_KNOWLEDGE_SOURCE_NAME: ${TOPIC_KNOWLEDGE_SOURCE_NAME}
            COSMOS_ENDPOINT: ${COSMOS_ENDPOINT}
            COSMOS_DATABASE: ${COSMOS_DATABASE}
            STORAGE_ACCOUNT_URL: ${STORAGE_ACCOUNT_URL}
            ARTIFACTS_CONTAINER: ${ARTIFACTS_CONTAINER}
            CONTENT_CONTAINER: ${CONTENT_CONTAINER}
        metadata:
            tags:
                - Agent Framework
                - Foundry IQ
                - Responses Protocol
        protocols:
            - protocol: responses
              version: 2.0.0
        uses:
            - ai-project
